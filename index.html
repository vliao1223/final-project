<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>


<style>
  
  @keyframes slide-in {
    0% {
      transform: translateY(-2vh);
    }
    100% {
      transform: translateY(30vh);
    }
  }
  
  @keyframes disappear {
    0% {
      transform: translateY(0vh);
    }
    100% {
      transform: translateY(70vh);
    }
  }
  
  @keyframes appear {
    0% {
      transform: translateY(70vh);
    }
    100% {
      transform: translateY(0vh);
    }
  }
  
  @keyframes shake {
    0%, 100% {
      transform: translateY(0vh);
    }
    50% {
      transform: translateY(2vh);
    }
  }
  
  @keyframes zzz {
    0% {
      transform: translateY(5vh);
      font-size: 1.5rem;
      opacity: 0.8;
    }
    100% {
      transform: translate(0vh);
      font-size: 1rem;
      opacity: 0;
    }
  }
  
  
  * {
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    width: 150vw;
    margin: 0;
    background: linear-gradient(180deg,rgba(242, 233, 228, 1) 80%, rgba(201, 173, 167, 1) 80%);
  }

  div.window {
    position: absolute;
    width: 30vmin;
    height: 35vmin;
    background: 
      radial-gradient(ellipse 100% 100% at top right, rgba(34, 34, 59, 0.8) 50%, transparent 50%) 3vmin 1vmin / 25vmin 40vmin no-repeat,
      linear-gradient(black) 14.75vmin 3vmin / 0.5vmin 30vmin no-repeat,
      radial-gradient(ellipse 60% 100% at bottom right, rgba(34, 34, 59, 0.8) 50%, transparent 50%) 13vmin 0vmin / 15vmin 40vmin no-repeat,
      linear-gradient(black) 14.75vmin 3vmin / 0.5vmin 30vmin no-repeat,
      
      
      
      linear-gradient(black) 3vmin 17vmin / 24vmin 0.5vmin no-repeat,
      radial-gradient(ellipse 100% 100%, black 50%, transparent 50%) 0.5vmin 0.65vmin / 1vmin 1.5vmin no-repeat,
      radial-gradient(ellipse 100% 100%, black 50%, transparent 50%) 28.3vmin 0.65vmin / 1vmin 1.5vmin no-repeat,
      linear-gradient(black) 1vmin 1vmin / 28vmin 0.8vmin no-repeat,
      linear-gradient(black) 26vmin 3vmin / 1vmin 30vmin no-repeat,
      linear-gradient(black) 3vmin 3vmin / 1vmin 30vmin no-repeat,
      linear-gradient(black) 3vmin 3vmin / 24vmin 1vmin no-repeat,
      linear-gradient(black) 3vmin 31.5vmin / 24vmin 1vmin no-repeat,
      linear-gradient(black) 0vmin 32vmin / 30vmin 2vmin no-repeat;
  }
  
  div.cat {
    position: absolute;
    top: 55vmin;
    width: 20vmin;
    height: 20vmin;
    background:
      
      /* tail */
      linear-gradient(rgba(255, 100, 100, 1)) 0vmin 10vmin / 1.5vmin 8vmin no-repeat,
      radial-gradient(circle closest-side, rgba(255, 100, 100, 1) 100%, transparent 100%) 0vmin 17vmin / 1.5vmin 1.5vmin no-repeat,
  
      radial-gradient(ellipse 100% 100% at bottom, rgba(255, 100, 100, 1) 50%, transparent 50%) 10vmin 2vmin / 8vmin 8vmin no-repeat,
      radial-gradient(ellipse 100% 100% at bottom, rgba(255, 100, 100, 1) 50%, transparent 50%) 0vmin -2vmin / 12vmin 12vmin no-repeat;
  }
  
  div.cat::before {
    content: "";
    position: absolute;
    top: 6vmin;
    left: 15vmin;
    width: 2vmin;
    height: 2vmin;
    background: linear-gradient(to bottom right, transparent 50%, rgba(255, 100, 100, 1) 50%) 0vmin 0vmin / 2vmin 2vmin no-repeat;
    transform: rotate(262deg);
  }
  
  div.cat::after {
    content: "";
    position: absolute;
    top: 5.6vmin;
    left: 11.8vmin;
    width: 2vmin;
    height: 2vmin;
    background: 
      linear-gradient(to bottom right, transparent 50%, #faf0e6 50%) 0vmin 0vmin / 1.5vmin 1.5vmin no-repeat,
      linear-gradient(to bottom right, transparent 35%, rgba(255, 100, 100, 1) 35%) 0vmin 0vmin / 2vmin 2vmin no-repeat;
    transform: rotate(210deg);
  }
  
  .sky {
    width: 24vmin;
    height: 28vmin;
    position: relative;
    z-index: -1;
    overflow: hidden;
    background: linear-gradient(180deg,rgba(6, 0, 89, 1) 0%, rgba(18, 18, 92, 1) 50%, rgba(1, 73, 117, 1) 100%);
  }
  
  div.person {
    position: absolute;
    top: 40vmin;
    left: 10vmin;
    width: 20vmin;
    height: 50vmin;
    animation: appear 1s ease-in-out 0s;
    background: linear-gradient(180deg,rgba(240, 194, 170, 1) 30%, rgba(41, 40, 40, 1) 30%);
  }
  
  h1.speech {
    font-size: 1.5rem;
    font-weight: 300;
    position: absolute;
    left: 32vmin;
    top: 37vh;
  }

  p.zzz {
    color: white;
    animation: zzz 3s ease-in-out 0s infinite;
    position: absolute;
  }
  
  button.light-switch {
    position: absolute;
    top: 50vmin;
    left: 50vmin;
    width: 3vmin;
    height: 5vmin;
  }
  
  div.speech-bubble {
    position: absolute;
    width: 10vmin;
    height: 10vmin;
    left: 35vmin;
    opacity: 0;
    background: radial-gradient(circle at top left, transparent 49%, black 49%, black 51%, transparent 51%);
  }
  
</style>

<div class="window"></div>
<div class="cat"></div>
<p class="zzz">Z</p>
<div class="sky"></div>
<div class="person"></div>
<h1 class="speech"></h1>
<button class="light-switch"></button>
<div class="speech-bubble"></div>


<script>
  function rain () {
    let x = nn.randomFloat(0, 100)
    nn.create('div')
      .css({
        width: '0.1vmin',
        height: '1vmin',
        background: 'white',
        animation: 'slide-in 0.8s ease-in-out 0s infinite',
        'animation-fill-mode': 'backwards',
      })
      .position(x, 0)
      .addTo('.sky')
  }
  
  const script = {
    1: "Hello there, traveler!",
    2: "Welcome to my little corner of the web.",
    3: "I've got to head out now. Take your time and look around.",
  }
  
  
  
  

  let state = {
    index: 0,
    light: 0,
  }
  
  
  async function talk () {
    state.index += 1
    if (state.index > 3) {
      return
    }
    nn.get('div.speech-bubble').css('opacity', '1')
    nn.get('h1.speech')
      .content(script[state.index])
    nn.get('.person')
      .css('animation', 'shake 0.2s ease-in-out 5')
    await nn.sleep(1000)
    nn.get('.person').css('animation', 'none')
    if (state.index === 3) {
      await nn.sleep(500)
      nn.get('div.speech-bubble').css('opacity', '0')
      nn.get('h1.speech').content('')
      nn.get('.person').css('animation', 'disappear 1s ease-in-out')
      await nn.sleep(3000)
      nn.get('.person').css('opacity', '0')
    }
  }
  
  let background
  
  function light () {
    state.light += 1
    if (state.light % 2 === 0) {
      background = "linear-gradient(180deg,rgba(242, 233, 228, 1) 80%, rgba(201, 173, 167, 1) 80%)"
    } else {
      background = "black"
    }
    nn.get('body').css('background', background)
  }

  nn.get('button.light-switch').on('click', light)
  nn.on('keydown', talk)
  nn.on('load', rain)
</script>
